<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Grey Road — Combat Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#1b1c1d; --surface:#252627; --surface2:#303233; --ink:#e9e9e6; --muted:#a3a5a1;
  --line:#3e4042; --warden:#a9d6b8; --warden-ink:#14211a; --blood:#e07a72; --heal:#79c99a;
  --ember:#e3b062; --hp-track:#34373a; --enemy:#e0a0a0;
  --head:"IM Fell English SC", "Palatino Linotype", Palatino, Georgia, serif;
  --body:"Alegreya Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--head);font-weight:400;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:.35rem .7rem}
button:hover{border-color:var(--warden)}
button.primary{background:var(--warden);color:var(--warden-ink);border-color:var(--warden)}
button.danger{color:var(--blood)}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--warden);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.3rem .45rem;max-width:100%}
input[type=number]{width:4.5rem}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:2px solid var(--warden);padding:.6rem 1rem}
.bar-row{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1.2rem;max-width:1100px;margin:0 auto}
.brand{font-family:var(--head);font-size:1.6rem;letter-spacing:.02em}
.brand small{display:block;font-family:var(--body);font-size:.8rem;color:var(--muted);letter-spacing:0}
.meta{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.95rem}
.meta b{color:var(--ink)}
.save{font-size:.8rem;color:var(--muted)}
nav.tabs{display:flex;gap:.25rem;max-width:1100px;margin:.6rem auto 0;overflow-x:auto}
nav.tabs button{border:none;background:none;border-bottom:3px solid transparent;border-radius:0;padding:.3rem .8rem;color:var(--muted)}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--warden)}
main{max-width:1100px;margin:0 auto;padding:1rem}
section.panel{display:none}
section.panel.on{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.8rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.75rem .85rem}
.card.turn{border-color:var(--warden);box-shadow:inset 4px 0 0 var(--warden)}
.card.down{opacity:.6}
.card.foe h3{color:var(--enemy)}
.card h3{font-size:1.25rem;display:flex;justify-content:space-between;gap:.5rem;align-items:baseline}
.card h3 .tag{font-family:var(--body);font-size:.8rem;color:var(--muted)}
.hp{margin:.45rem 0 .3rem}
.hp-track{height:12px;background:var(--hp-track);border-radius:6px;overflow:hidden}
.hp-fill{height:100%;background:var(--heal);transition:width .3s}
.hp-fill.mid{background:var(--ember)} .hp-fill.low{background:var(--blood)}
.hp-num{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted);margin-top:.15rem}
.hp-num b{color:var(--ink);font-size:1.05rem}
.row{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-top:.4rem}
.chips{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.35rem}
.chip{font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:.05rem .55rem;background:var(--surface2)}
.chip.cd{border-color:var(--ember);color:var(--ember)}
.chip.ready{border-color:var(--heal);color:var(--heal)}
.chip.status{border-color:var(--warden);color:var(--warden)}
.chip.burn{border-color:var(--blood);color:var(--blood)}
.order{display:flex;gap:.35rem;flex-wrap:wrap;margin:.2rem 0 1rem}
.order span{padding:.15rem .55rem;border-radius:6px;background:var(--surface2);font-size:.9rem}
.order span.now{background:var(--warden);color:var(--warden-ink)}
.order span.out{text-decoration:line-through;opacity:.55}
.action{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.8rem;margin-bottom:1rem}
.action h2{font-size:1.3rem;margin-bottom:.4rem}
.field{display:flex;flex-direction:column;gap:.15rem;font-size:.85rem;color:var(--muted)}
.field > *{color:var(--ink)}
.result{margin-top:.6rem;padding:.55rem .7rem;border-left:3px solid var(--warden);background:var(--surface2);border-radius:0 6px 6px 0;white-space:pre-wrap;font-size:.95rem}
.log{max-height:60vh;overflow:auto;font-size:.92rem}
.log div{padding:.3rem 0;border-bottom:1px solid var(--line)}
.log time{color:var(--muted);font-size:.8rem;margin-right:.4rem}
table{border-collapse:collapse;width:100%;font-size:.92rem}
.tablewrap{overflow-x:auto}
td,th{text-align:left;padding:.3rem .45rem;border-bottom:1px solid var(--line)}
th{font-weight:500;color:var(--muted)}
.ab{border-top:1px solid var(--line);padding:.4rem 0}
.ab:first-child{border-top:none}
.ab p{margin:.15rem 0 0;font-size:.88rem;color:var(--muted)}
.muted{color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem}
.big{font-family:var(--head);font-size:1.6rem}
@media (prefers-reduced-motion: reduce){.hp-fill{transition:none}}

.rf-banner{margin:1.1rem 0 .5rem;padding:.35rem .8rem;border-radius:6px;background:var(--surface2);border-left:4px solid var(--line);font-family:var(--head);font-size:1.25rem;letter-spacing:.03em}
.rf-banner.active{background:var(--warden);color:var(--warden-ink);border-left-color:var(--warden)}
.rf-hist{font-size:.9rem;color:var(--muted);padding:0 .3rem .2rem;white-space:pre-wrap}
.rf-div{display:block;margin:.5rem 0 .15rem;font-family:var(--head);color:var(--ink);font-size:1rem;border-bottom:1px solid var(--line)}
.rf-scroll{max-height:16rem;overflow-y:auto;border:1px solid var(--line);border-radius:6px;padding:.4rem .6rem;margin:.2rem 0 .8rem;background:var(--surface)}
.rf-histbox{max-height:16rem;overflow-y:auto;border:1px solid var(--line);border-radius:6px;padding:.2rem .5rem .4rem;margin:.2rem 0 .8rem}
.rf-hpbox{display:flex;gap:.3rem;align-items:center;margin-top:.4rem}
.rf-hpbox input{width:4rem}
.rf-hpbox button{padding:.2rem .6rem;font-weight:700}
.rf-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:1rem}
.rf-box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem 1.2rem;max-width:360px;width:100%}
.rf-box h3{font-size:1.3rem;margin-bottom:.3rem}
.rf-note{font-size:.88rem;color:var(--muted);margin:.35rem 0 0;white-space:pre-wrap}

.warden-badge{display:inline-block;vertical-align:-4px;margin-left:.45rem;width:2.1rem;height:1.82rem;color:var(--warden)}
.si-item{padding:.7rem 0;border-bottom:1px solid var(--line)}
.si-item:last-child{border-bottom:0}
.si-name{display:inline-block;margin:0 0 .35rem;padding:.15rem .7rem;font-family:var(--head);font-size:1.5rem;line-height:1.25;color:var(--ink);background:rgba(169,214,184,.2);border-left:4px solid var(--warden);border-radius:4px}
.si-desc{margin:.2rem 0 0;font-size:1rem;line-height:1.45}
.dryden-badge{display:inline-block;vertical-align:-7px;margin-left:.45rem;width:2.3rem;height:2.3rem;--dr-silver:#c9cdd2;--dr-grey:#3b4046;--dr-emerald:#1fb37a;--dr-emerald-dk:#0b6a47}
.rc-card{border-left:4px solid var(--warden)}
.rc-name{font-size:1.6rem!important;color:var(--warden);border-bottom:1px solid var(--line);padding-bottom:.25rem;margin-bottom:.4rem}
.rc-status{display:inline-block;font-size:.82rem;font-weight:700;border:1px solid var(--heal);color:var(--heal);border-radius:999px;padding:.05rem .6rem;margin:.1rem 0 .4rem}
.rc-row{display:grid;grid-template-columns:5.2rem 1fr;gap:.5rem;padding:.3rem 0;border-top:1px solid var(--line);font-size:.92rem}
.rc-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:.15rem}
.rc-val{color:var(--ink)}
.rc-list{margin:.3rem 0 0 1.1rem;padding:0;font-size:.95rem;line-height:1.4}
.rc-list li{margin:.18rem 0}
.rc-count{font-size:.8rem;font-family:var(--body);color:var(--muted);margin-left:.4rem}
.rc-group{grid-column:1/-1}
.rc-members{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:.6rem;margin-top:.5rem}
.rc-member{border-top:1px solid var(--line);padding-top:.4rem}
.rc-member h4{margin:.1rem 0 .2rem;font-size:1.1rem;color:var(--ink)}
</style>
</head>

<script>
/* ---------- dice ---------- */
const rnd = n => Math.floor(Math.random()*n)+1;
function parseDice(expr){
  const out={terms:[],flat:0}; if(!expr) return out;
  expr.replace(/\s/g,'').replace(/-/g,'+-').split('+').filter(Boolean).forEach(t=>{
    const m=t.match(/^(-?)(\d*)d(\d+)$/i);
    if(m){out.terms.push({n:(+(m[2]||1))*(m[1]?-1:1),s:+m[3]});}
    else if(!isNaN(+t)) out.flat+=+t;
  });
  return out;
}
function rollExpr(expr,crit=false){
  const p=parseDice(expr); let dice=0; const faces=[];
  p.terms.forEach(t=>{const k=Math.abs(t.n);for(let i=0;i<k;i++){const r=rnd(t.s);faces.push(`d${t.s}:${r}`);dice+=r*Math.sign(t.n)}});
  if(crit) dice*=2;
  return {total:dice+p.flat,dice,flat:p.flat,faces};
}
function attackTable(r){
  if(r===1) return {mod:null,label:'Miss'};
  if(r<=7) return {mod:-2,label:'−2'};
  if(r<=13) return {mod:0,label:'+0'};
  if(r<=19) return {mod:2,label:'+2'};
  return {mod:0,label:'Critical (dice ×2)',crit:true};
}

}

function log(msg){S.log.unshift({t:Date.now(),m:msg}); if(S.log.length>150) S.log.length=150}
let saveTimer=null;
const DRIVE={
  token:null, fileId:null, busy:false, pending:false,
  clientId(){try{return localStorage.getItem('greyroad_gdrive_cid')||''}catch(e){return ''}},
  setClientId(v){try{localStorage.setItem('greyroad_gdrive_cid',v.trim())}catch(e){}},
  connect(silent=false){
    const cid=this.clientId();
    if(!cid){if(!silent) setDriveMsg('Paste your Google Client ID first.'); return}
    if(!window.google||!google.accounts||!google.accounts.oauth2){if(!silent) setDriveMsg('Google Identity script still loading—try again in a second.'); return}
    const client=google.accounts.oauth2.initTokenClient({
      client_id:cid,
      scope:'https://www.googleapis.com/auth/drive.file',
      callback:async resp=>{
        if(resp.error){setDriveMsg('Google sign-in failed: '+resp.error); return}
        this.token=resp.access_token;
        setSave('Syncing with Drive…');
        await this.loadOrCreate();
      }
    });
    client.requestAccessToken({prompt:silent?'':'consent'});
  },
  async api(url,opts={}){
    const res=await fetch(url,{...opts,headers:{'Authorization':'Bearer '+this.token,...(opts.headers||{})}});
    if(res.status===401){this.token=null; setSave('Drive session expired'); setDriveMsg('Drive session expired—click Connect Google Drive to reconnect.'); throw new Error('401')}
    return res;
  },
  async loadOrCreate(){
    try{
      const q=encodeURIComponent("name='the-grey-road-save.json' and trashed=false");
      const r=await this.api(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime)`);
      const data=await r.json();
      if(data.files&&data.files.length){
        this.fileId=data.files[0].id;
        const fr=await this.api(`https://www.googleapis.com/drive/v3/files/${this.fileId}?alt=media`);
        const remote=await fr.json();
        if(remote&&remote.party&&remote.inv){
          S=remote;
          try{localStorage.setItem('greyroad',JSON.stringify(S))}catch(e){}
          render();
          setSave('Synced with Google Drive');
          setDriveMsg('Loaded save from Google Drive.');
          return;
        }
      }
      await this.push(true);
    }catch(e){
      setSave('Saved on this device only');
      setDriveMsg('Drive error: '+e.message);
    }
  },
  async push(creating=false){
    if(!this.token) return;
    if(this.busy){this.pending=true; return}
    this.busy=true; setSave('Saving to Drive…');
    try{
      const body=JSON.stringify(S);
      if(!this.fileId||creating){
        const meta={name:'the-grey-road-save.json',mimeType:'application/json'};
        const boundary='greyroad_boundary_99';
        const multipart=`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${boundary}--`;
        const r=await this.api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{
          method:'POST',
          headers:{'Content-Type':`multipart/related; boundary=${boundary}`},
          body:multipart
        });
        const j=await r.json();
        if(j.id) this.fileId=j.id;
      }else{
        await this.api(`https://www.googleapis.com/upload/drive/v3/files/${this.fileId}?uploadType=media`,{
          method:'PATCH',
          headers:{'Content-Type':'application/json'},
          body
        });
      }
      setSave('Synced with Google Drive');
      setDriveMsg('Synced to Google Drive ('+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+').');
    }catch(e){
      setSave('Saved on this device only');
    }
    this.busy=false;
    if(this.pending){this.pending=false; this.push()}
  }
};

  try{localStorage.setItem('greyroad',JSON.stringify(S))}catch(e){}

}

/* ---------- combat logic ---------- */
function weaponDamage(c,crit,useAlt){
  const wk=useAlt&&c.alt?c.alt:c.weapon; const w=WEAPON[wk];
  const bonus=(c.wTier||0)+(c.mods[w.stat]||0);
  if(w.dual){
    const b1=Math.ceil(bonus/2)+(c.dmgPerSwing||0), b2=Math.floor(bonus/2)+(c.dmgPerSwing||0);
    const r1=rollExpr(w.die,crit), r2=rollExpr(w.die,crit);
    return {total:r1.total+b1+r2.total+b2,text:`${wk}: [${r1.faces}]+${b1} and [${r2.faces}]+${b2}`};
  }
  const r=rollExpr(w.die,crit);
  return {total:r.total+bonus,text:`${wk}: [${r.faces}]+${bonus}`};
}
function enemyHits(e){return e.rank==='boss'?2:1}
function enemyHit(e,crit){
  const n=e.rank==='normal'?1:2, flat=S.level+(e.rank==='elite'?3:1);
  const r=rollExpr(`${n}d${e.die}`,crit); return {total:r.total+flat,text:`[${r.faces}]+${flat}`};
}
function enemyDamage(e,crit){
  let tot=0, txt=[]; for(let i=0;i<enemyHits(e);i++){const h=enemyHit(e,crit); tot+=h.total; txt.push(h.text)}
  return {total:tot,text:txt.join(' + ')};
}
function applyDamage(t,amt,src){
  let note='';
  const f=t.statuses.find(s=>s.name==='Fortify');
  if(f&&amt>0){const red=Math.ceil(amt*(1-f.pct/100)); note=` (Fortify ${f.pct}%: ${amt}→${red})`; amt=red}
  const before=hpOf(t); t.hp=Math.max(0,before-amt);
  if(S.battle&&isFriendly(t)) S.battle.taken+=Math.min(amt,before);
  if(t.hp===0&&!t.down){t.down=true; note+= isFriendly(t)?` — ${t.name} is downed`:` — ${t.name} falls`; if(S.battle&&isFriendly(t)) S.battle.downs++}
  return {amt,note};
}
function heal(t,amt,canRevive){
  if(t.down&&!canRevive) return {blocked:true};
  const mx=maxHP(t); const before=hpOf(t); t.hp=Math.min(mx,before+amt); if(t.hp>0) t.down=false;
  return {gained:t.hp-before};
}
function isFriendly(c){return c.kind!=='foe'}

function setCd(c,ab){if(ab.cd>0){c.cds[ab.n]=ab.cd; c.used['_cd_'+ab.n]=true}}

function rollInitiative(){
  const list=all().filter(c=>!(c.kind==='foe'&&c.down)).map(c=>{
    const dex=c.kind==='pc'?c.mods.DEX:(c.dex||0); const r=rnd(20); return {id:c.id,score:r+dex,raw:r,dex};
  }).sort((x,y)=>y.score-x.score);
  S.order=list.map(x=>x.id); S.turn=0; S.init={}; list.forEach(x=>{S.init[x.id]=x.score});
  log('Initiative: '+list.map(x=>`${x.id} ${x.score} (${x.raw}${x.dex>=0?'+':''}${x.dex})`).join(', '));
  S.lastResult='Turn order rolled.\n'+list.map(x=>`${x.id}: ${x.score}`).join('\n');
}

const DROP_TYPE={darkspawn:'medkits',bandits:'either',templars:'potions',mages:'potions',undead:'medkits',beasts:'none',spirits:'none'};
function rollLoot(basic,elite,boss,type){
  let coins=0; const parts=[];
  for(let i=0;i<basic;i++){const c=rnd(12);coins+=c;parts.push(c)}
  for(let i=0;i<elite;i++){const c=5+rnd(19);coins+=c;parts.push(c)}
  for(let i=0;i<boss;i++){const c=11+rnd(30);coins+=c;parts.push(c)}
  let items=0, kind=DROP_TYPE[type]||'either';
  if(kind!=='none'){
    const base=basic>0?rnd(Math.max(1,Math.floor(basic/2))):0;
    items=base+elite+boss;
    if(kind==='either') kind=Math.random()<.5?'potions':'medkits';
  }
  let shards=0;
  if(type==='spirits'){shards=basic+elite*2; for(let i=0;i<boss;i++) shards+=2+rnd(3)}
  return {coins,parts,items,kind,shards};
}

  if(c.kind!=='pc') return '';

function rfDelta(t,d){
  const mx=maxHP(t), b=hpOf(t); const was=t.down;
  if(d<0&&t.temp>0){const ab=Math.min(t.temp,-d); t.temp-=ab; d+=ab}
  t.hp=Math.max(0,Math.min(mx,b+d)); t.down=t.hp===0;
  if(isFriendly(t)&&d<0){const R=rf(); R.taken=(R.taken||0)+Math.min(-d,b); t.took=(t.took||0)+Math.min(-d,b)}
  if(isFriendly(t)){const R=rf(); const f=mx?t.hp/mx:1; R.minF=(R.minF==null)?f:Math.min(R.minF,f)}
  if(isFriendly(t)&&t.down&&!was){const R=rf(); R.downs=(R.downs||0)+1}
}
function rfLine(m){rf().lines.push(m)}

function abn(c,ab){const t=ab&&ab.tn?ab.tn[Math.max(0,((c.known&&c.known[ab.n])||1)-1)]:null; return t||(ab?ab.n:'')}
function rfAbility(c,name){return name&&(c.kind==='pc'||c.kind==='ally')&&ABILITIES[c.name]?ABILITIES[c.name].find(a=>a.n===name):null}
function rfTier(c,ab){return ab?((c.known&&c.known[ab.n])||1):1}

function rfRollTotal(c,sel){
  const R=rf(), ab=rfAbility(c,sel.ab), ti=rfTier(c,ab)-1, tgt=byId(sel.tgt);
  if(sel.ab==='__medkit'){
    let expr='1d6+2', extra=0; if(c.name==='Leon'&&c.known['Field Medic']){expr=ABILITIES.Leon[0].t[c.known['Field Medic']-1].match(/\d+d\d+\+\d+/)[0]; extra+=2}
    if(tgt&&tgt.healBonus) extra+=tgt.healBonus; const x=rollExpr(expr);
    return {total:x.total+extra,text:`Med kit ${expr}: [${x.faces}]+${x.flat}${extra?'+'+extra:''} = ${x.total+extra} (uses your whole turn)`,heal:true};
  }
  if(ab&&['mark','vanish','roar','hymn'].includes(ab.kind)) return {total:0,text:`${ab.n}: no roll needed. Pick a target if it asks for one, then Apply.`,util:true};
  if(ab&&(ab.kind==='burst'||ab.kind==='barrier')){const x=rollExpr(ab.h[ti]); const b=ab.kind==='burst'?(c.healGive||0):0; return {total:x.total+b,text:`${ab.n}: [${x.faces}]+${x.flat}${b?'+'+b:''} ${(ab.team&&ab.team[ti])||ab.kind==='burst'?'for each ally':'for one ally'}`,heal:true}}
  if(ab&&ab.kind==='heal'){const x=rollExpr(ab.h[ti]); const b=c.healGive||0; return {total:x.total+b,text:`${ab.n}: [${x.faces}]+${x.flat}${b?'+'+b:''} (healing)`,heal:true}}
  if(ab&&ab.kind==='revive') return {total:0,text:'Revive: a downed ally returns at 25% max HP.',revive:true};
  const hy=R.hymn&&R.hymn.turns>0?R.hymn:null, atk=hy?hy.atk:0;
  const first=sel.first!==undefined?sel.first:(c.name==='Anton'&&!c.used['_first']);
  const asn=(c.name==='Anton'&&c.known&&c.known['Assassinate'])||0, useAsn=!!(asn&&first);
  const advOn=!!(sel.adv||useAsn||(ab&&ab.adv&&ab.adv[ti]));
  const r1=rnd(20), r2=advOn?rnd(20):null, raw=advOn?Math.max(r1,r2):r1;
  const adj=(raw===1||raw===20)?raw:Math.min(19,raw+atk); let tab=attackTable(adj);
  if(useAsn&&asn>=3) tab={...tab,mod:(tab.mod===null?0:tab.mod),crit:true,label:'Critical (Assassinate)'};
  const head=`d20 ${raw}${advOn?' ('+r1+'/'+r2+')':''}${atk?' +'+atk+' hymn':''} → ${tab.label}`;
  if(tab.mod===null) return {total:0,text:head+' · Miss',miss:true};
  const base=()=>{ if(c.kind==='ally'){const x=rollExpr(c.dmg,tab.crit);return {total:x.total,text:`[${x.faces}]+${x.flat}`}} return weaponDamage(c,tab.crit,sel.alt) };
  let total=0, text='', hitsArr=null;
  if(ab&&ab.n==='Triple Arrow'){
    const tier=ti+1, pct=tier>=3?1:.75, plus=tier>=2?1:0, arrows=[];
    for(let i=0;i<3;i++){const w=weaponDamage(c,tab.crit,sel.alt); arrows.push(Math.ceil(w.total*pct)+plus)}
    total=arrows.reduce((s,x)=>s+x,0)+tab.mod; hitsArr=arrows; text=`Arrows: ${arrows.join(', ')} (split them across targets if you like)`;
  } else if(ab&&ab.kind==='multi'){
    const hits=[]; for(let i=0;i<ab.hits[ti];i++) hits.push(rollExpr(ab.each[ti],tab.crit).total);
    total=hits.reduce((s,x)=>s+x,0)+tab.mod; hitsArr=hits; text=`${abn(c,ab)}: ${hits.join(', ')}`;
  } else if(ab&&ab.two){
    const xs=ab.two[ti], hits=[]; for(let i=0;i<2;i++){const w=base(); const x=rollExpr(xs[i],tab.crit); hits.push(w.total+x.total)}
    total=hits[0]+hits[1]+tab.mod; hitsArr=hits; text=`${ab.n}: hit 1 ${hits[0]}, hit 2 ${hits[1]} (two separate hits, they can go to different enemies)`;
  } else if(ab&&(ab.kind==='solo'||ab.kind==='sweep')){
    const x=rollExpr(ab.d[ti],tab.crit); total=x.total+tab.mod; text=`${ab.n}: [${x.faces}]+${x.flat}${ab.kind==='sweep'?' to EACH adjacent enemy':''}`;
  } else {
    const w=base(); total=w.total+tab.mod; text=w.text;
    if(ab&&ab.kind==='add'&&ab.d){const x=rollExpr(ab.d[ti],tab.crit); total+=x.total; text+=` · ${abn(c,ab)} [${x.faces}]+${x.flat}`}
    if(ab&&ab.reprisal){const bn=Math.min(c.took||0,ab.reprisal[ti]); total+=bn; text+=` · reprisal +${bn} (Tyr took ${c.took||0})`}
  }
  if(hy&&hy.dmg){const x=rollExpr(hy.dmg); total+=x.total; text+=` · hymn +${x.total}`}
  if(useAsn&&asn>=2){const ax=rollExpr('1d4'); total+=ax.total; text+=` · Assassinate +${ax.total}`}
  const mk=tgt&&tgt.statuses&&tgt.statuses.find(x=>x.name==='Marked');
  if(mk){total+=[2,2,3][mk.tier-1]; text+=` · mark +${[2,2,3][mk.tier-1]}`; if(mk.tier>=2&&!mk.used){const x=rollExpr(mk.tier===2?'1d4':'1d6'); total+=x.total; mk.used=true; text+=` +${x.total}`}}
  total=Math.max(0,total);
  return {total,hits:hitsArr,mod:tab.mod,crit:tab.crit,text:`${head} · ${text} · ${tab.mod>=0?'+':''}${tab.mod} = ${total}`};
}

    used=u.length?u.map(x=>x[0]+' '+x[1]+(x[0]>1?'s':'')).join(', '):'none';
  }
  const text=`FIGHT RESULT: ${diff}.${why?' '+why:''}\nRounds: ${R.n-1+(R.lines.length?1:0)}. Damage taken: ${taken}/${mx} (${pct}%). Net HP lost: ${net}%. Lowest HP reached: ${Math.round(minF*100)}%. Downed: ${downs}.\nDefeated: ${Object.keys(names).map(k=>names[k]+' '+k).join(', ')||'none'}.${live.length?'\nStill standing: '+live.map(e=>e.name+' '+hpOf(e)+'/'+e.max+' HP').join(', ')+'.':''}\nHP (start → end): ${hpLine}.\nItems used: ${used}.\nSupplies now: ${S.inv.potions} potions, ${S.inv.medkits} med kits, ${S.inv.shards||0} Fade Shards, ${S.inv.coin} sov.\nLoot (not applied yet): ${ld.coins} sov${ld.items?', '+ld.items+' '+ld.kind:''}${ld.got.length?', drops: '+ld.got.join(', '):''}${ld.shards?', '+ld.shards+' Fade Shards':''}.`;

function qaRest(kind){

  const msg=(kind==='night'?'Full night’s sleep: ':'Short rest: ')+out.join(', '); log(msg); S.lastResult=msg; commit(); qaMsg(msg)

function applyAiStorySync(raw){
  const msgEl=document.getElementById('ai-sync-msg');
  try{
    const cleaned=raw.replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
    const d=JSON.parse(cleaned);
    const changes=[];
    S.story=S.story||{updated:'',sections:[{title:'Current scene',items:[]},{title:'Summary',items:[]},{title:'Open threads',items:[]}]};
    S.story.updated=new Date().toLocaleDateString([],{month:'short',day:'numeric'});
    if(d.scene){
      let sc=S.story.sections.find(x=>/current scene/i.test(x.title||''));
      if(!sc){sc={title:'Current scene',items:[]}; S.story.sections.unshift(sc)}
      sc.items=[d.scene]; changes.push('scene updated');
    }
    if(d.summary){
      let sm=S.story.sections.find(x=>/summary/i.test(x.title||''));
      if(!sm){sm={title:'Summary',items:[]}; S.story.sections.push(sm)}
      sm.items.push(d.summary); changes.push('summary added');
    }
    if(Array.isArray(d.threads)){
      let th=S.story.sections.find(x=>/open thread/i.test(x.title||''));
      if(!th){th={title:'Open threads',items:[]}; S.story.sections.push(th)}
      d.threads.forEach(t=>{if(t&&!th.items.includes(t)){th.items.push(t); changes.push('thread: '+t)}});
    }
    if(Array.isArray(d.closeThreads)){
      let th=S.story.sections.find(x=>/open thread/i.test(x.title||''));
      if(th) d.closeThreads.forEach(ct=>{th.items=th.items.filter(x=>!x.toLowerCase().includes(ct.toLowerCase())); changes.push('closed thread: '+ct)});
    }
    if(Array.isArray(d.items)){
      S.special=S.special||[];
      d.items.forEach(it=>{if(it&&it.name){S.special.push({name:it.name,desc:it.desc||'',group:it.group||'Story',from:it.from||''}); changes.push('item: '+it.name)}});
    }
    if(Array.isArray(d.recruits)){
      S.recruits=S.recruits||[];
      d.recruits.forEach(r=>{if(r&&r.name){S.recruits.push(r); changes.push('recruit: '+r.name)}});
    }
    if(Array.isArray(d.maps)){
      S.maps=S.maps||[];
      d.maps.forEach(m=>{if(m&&m.name){S.maps.push({name:m.name,desc:m.desc||''}); changes.push('map: '+m.name)}});
    }
    if(d.supplies&&typeof d.supplies==='object'){
      Object.entries(d.supplies).forEach(([k,v])=>{const n=+v||0; if(n){S.inv[k]=Math.max(0,(S.inv[k]||0)+n); changes.push(`${k} ${n>0?'+':''}${n}`)}});
    }
    if(d.level&&+d.level>S.level){S.level=+d.level; changes.push('level '+S.level)}
    if(!changes.length){if(msgEl) msgEl.textContent='Valid JSON, but no fields changed.'; return}
    log('AI Sync: '+changes.join(', '));
    commit();
    const afterMsg=document.getElementById('ai-sync-msg');
    if(afterMsg) afterMsg.textContent='Applied: '+changes.join(' · ');
  }catch(err){
    if(msgEl) msgEl.textContent='Could not read that block—make sure you copied the full JSON from Gemini.';
  }
}

  if(b.id==='qa-thr'){const tx=val('qa-thread').trim(); if(!tx) return qaMsg('Type the thread first.'); const sec=S.story&&S.story.sections; const t=sec&&sec.find(x=>/open thread/i.test(x.title||'')); if(!t) return qaMsg('No Open threads section found.'); t.items.push(tx); log('Open thread added: '+tx); commit(); return}
  if(b.dataset.spdel!==undefined){const i=+b.dataset.spdel, it=S.special[i]; if(it){S.special.splice(i,1); log('Special item removed: '+it.name); commit()} return}

});

    log(S.lastResult); return commit();
  }
  if(id==='u-ration'){if(S.inv.rations<=0){S.lastResult='No rations left.';return commit()} S.inv.rations--; log('The party eats a day’s ration.'); return commit()}
  if(id==='l-roll'){
    const r=rollLoot(+val('l-basic')||0,+val('l-elite')||0,+val('l-boss')||0,val('l-type'));
    S.inv.coin+=r.coins; if(r.kind==='potions') S.inv.potions+=r.items; if(r.kind==='medkits') S.inv.medkits+=r.items; S.inv.shards+=r.shards;
    S.lastLoot=`Sovereigns: ${r.coins} (${r.parts.join(' + ')||'none'})\n${r.items?`${r.items} ${r.kind==='potions'?'health potion(s)':'med kit(s)'}`:'No consumables'}${r.shards?`\nFade Shards: ${r.shards}`:''}\nAdded to supplies.`;
    log('Loot: '+S.lastLoot.replace(/\n/g,' ')); S.lootPrefill=null; return commit();
  }
  if(id==='s-roll'){
    const d=rnd(6), pct=10+rnd(6)-1, s=rnd(20);
    S.lastShop=`Price roll d6: ${d} → prices ${d<=3?'lower':'higher'} by ${pct}%.\nSale roll d20: ${s} → ${s<=4?'one random item is 50% off':'no sale'}.`;
    log('Shop: '+S.lastShop.replace(/\n/g,' ')); return commit();
  }
  if(id==='k-roll'){
    const c=S.party.find(x=>x.name===val('k-who')); const st=val('k-stat'); const r=rnd(20);
    let tot=r+c.mods[st], parts=[`d20 ${r}`,`${st} ${c.mods[st]>=0?'+':''}${c.mods[st]}`];
    if(chk('k-prof')){tot+=profBonus();parts.push(`prof +${profBonus()}`)}
    if(c.name==='Anton'&&st==='CHA'){tot+=2;parts.push('Anton CHA +2')}
    const ex=val('k-extra'); if(ex){const x=rollExpr(ex); tot+=x.total; parts.push(`${ex} [${x.faces}]`)}
    S.lastCheck=`${c.name} ${st} check: ${tot}  (${parts.join(', ')})`; log(S.lastCheck); return commit();
  }
  if(id==='log-clear'){S.log=[];return commit()}
  if(id==='save-export'){
    const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=`the-grey-road-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(a.href);
    const bm=document.getElementById('backup-msg'); if(bm) bm.textContent='Backup downloaded.';
    return;
  }
  if(id==='save-import'){const f=document.getElementById('save-file'); if(f) f.click(); return}
  if(id==='reset-all'){if(confirm('Reset all characters, enemies, supplies and the log?')){S=defaults();commit()}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='save-file'&&t.files&&t.files[0]){
    const r=new FileReader();
    r.onload=()=>{
      try{
        const p=JSON.parse(r.result);
        if(p&&p.party&&p.inv){S=p; commit(); const bm=document.getElementById('backup-msg'); if(bm) bm.textContent='Backup restored.'}
        else {const bm=document.getElementById('backup-msg'); if(bm) bm.textContent='Invalid backup file.'}
      }catch(err){const bm=document.getElementById('backup-msg'); if(bm) bm.textContent='Could not read JSON file.'}
    };
    r.readAsText(t.files[0]); t.value=''; return;
  }
});
function val(id){const el=document.getElementById(id); return el?el.value:''}
function chk(id){const el=document.getElementById(id); return el?el.checked:false}

/* ---------- boot ---------- */
try{const saved=localStorage.getItem('greyroad'); if(saved){const p=JSON.parse(saved); if(p&&p.v===2) S=p}}catch(e){}
render();
</script>
</body>
